# Behavedr macOS pf anchor - C2 IP table used by MacOSNetworkIsolation
# Load (root):
#   pfctl -a behavedr -f /opt/behavedr/pf-behavedr-block.conf
#   pfctl -e   # if pf not already enabled
#
# The agent also attempts: pfctl -t behavedr_block -T add <ip>
# This file documents the durable anchor layout for production installs.

table <behavedr_block> persist
block drop out quick from any to <behavedr_block>
block drop in  quick from <behavedr_block> to any
